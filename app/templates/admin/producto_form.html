{% extends 'base.html' %}

{% block title %}{{ 'Editar producto' if producto else 'Nuevo producto' }}{% endblock %}

{% block content %}
<h1 class="mb-4">{{ 'Editar producto' if producto else 'Nuevo producto' }}</h1>

<form method="post" enctype="multipart/form-data" class="col-md-6">
    <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control" required
               value="{{ producto.nombre if producto else '' }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Descripción</label>
        <textarea name="descripcion" class="form-control" rows="3">{{ producto.descripcion if producto else '' }}</textarea>
    </div>

    <div class="row">
        <div class="col-6 mb-3">
            <label class="form-label">Precio</label>
            <input type="number" step="0.01" min="0" name="precio" class="form-control" required
                   value="{{ producto.precio if producto else '' }}">
        </div>
        <div class="col-6 mb-3">
            <label class="form-label">Stock</label>
            <input type="number" min="0" name="stock" class="form-control" required
                   value="{{ producto.stock if producto else 0 }}">
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Categoría</label>
        <select name="categoria_id" class="form-select" required>
            <option value="">Selecciona una categoría</option>
            {% for categoria in categorias %}
            <option value="{{ categoria.id }}"
                {% if producto and producto.categoria_id == categoria.id %}selected{% endif %}>
                {{ categoria.nombre }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Imagen</label>
        {% if producto and producto.imagen %}
        <div class="mb-2">
            <img src="{{ url_for('static', filename='img/' + producto.imagen) }}"
                 style="width:80px; height:80px; object-fit:cover;">
        </div>
        {% endif %}
        <input type="file" name="imagen" class="form-control" accept="image/*">
    </div>

    <button type="submit" class="btn btn-success">Guardar</button>
    <a href="{{ url_for('admin.productos') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
